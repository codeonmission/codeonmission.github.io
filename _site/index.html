<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Code on Mission is a collection of software projects for everyday faith. Explore Stillwater, an app for Scripture, prayer, and reflection.">
  <meta name="theme-color" content="#f8f7f2">
  <title>Code on Mission — Projects</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="top" class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="./"><span class="brand-mark" aria-hidden="true">✳</span> Code on Mission</a>
      <nav aria-label="Main navigation">
        <a href="#projects">Projects</a>
      </nav>
    </div>
  </header>

  <main id="main" class="shell">
    <section class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title">Small tools for<br>a life of <em>faith.</em></h1>
      <p>A collection of software projects for the habits that shape everyday faith.</p>
    </section>

    <section id="projects" aria-labelledby="projects-title">
      <div class="section-heading">
        <h2 id="projects-title" class="eyebrow">Projects</h2>
      </div>

      <article class="project-card">
        <div class="project-copy">
          <img class="app-icon" src="assets/stillwater-icon.png" width="64" height="64" alt="">
          <h3>Stillwater</h3>
          <p>A daily rhythm of Scripture, prayer, and reflection.</p>
          <a class="button button-light" href="stillwater/">Explore Stillwater</a>
        </div>
        <figure class="project-art">
          <img class="lake-backdrop" src="assets/stillwater-lake.jpg" width="1500" height="750" alt="">
          <div class="phone" aria-hidden="true">
            <div class="phone-camera"></div>
            <div class="phone-content">
              <div class="phone-title">Today</div>
              <p class="phone-subtitle">A daily rhythm of Scripture, prayer, and reflection.</p>
              <div class="phone-verse">
                <span>Verse of the day</span>
                <p>“The LORD is my shepherd; I shall not want.”</p>
                <cite>Psalm 23:1 · KJV</cite>
              </div>
              <div class="phone-rhythm">Daily rhythm</div>
              <div class="phone-progress"></div>
              <div class="phone-item"><i></i>Bible reading</div>
              <div class="phone-item"><i></i>Prayer session</div>
              <div class="phone-item"><i></i>Scripture memory</div>
            </div>
          </div>
          <figcaption class="visually-hidden">Illustration of Stillwater’s Today screen, showing a verse from Psalm 23 and the daily reading, prayer, and memory activities.</figcaption>
        </figure>
      </article>
    </section>

  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <a class="wordmark" href="./"><span class="brand-mark" aria-hidden="true">✳</span> Code on Mission</a>
      <a href="#top">Back to top</a>
    </div>
  </footer>
</body>
</html>
